name: build-ipa

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Ruby (for fastlane, optional)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.x'

      - name: Install dependencies
        run: |
          gem install bundler || true
          bundle install || true

      - name: Install CocoaPods (if used)
        run: |
          sudo gem install cocoapods || true
          pod install --repo-update || true
        working-directory: ./ # adjust if workspace location differs

      - name: Build and export IPA (placeholder)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Replace this with xcodebuild / fastlane commands to build the ipa"
          echo "Example (fastlane): bundle exec fastlane build"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: ./path/to/YourApp.ipa
